<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendar - Meal Planner</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2e7d4f"><link rel="apple-touch-icon" href="icon-192.png"></head><body data-p="calendar"><main>
<h1>Festival &amp; Upvas calendar</h1><div class="row"><button class="g" id="pv">&lt;</button><b id="mt"></b><button class="g" id="nx">&gt;</button></div><div class="cal card" id="cal"></div><div class="card"><h2>Add your own date</h2><div class="row"><input type="date" id="ed"><input id="en" placeholder="Name (e.g. Ekadashi)"><select id="et"><option value="u">Upvas</option><option value="f">Festival</option></select><button id="ae">Add</button></div><p style="color:var(--mu);font-size:13px">Built-in dates are samples; verify with your panchang and add your own.</p></div>
</main><script src="app.js"></script></body></html>
